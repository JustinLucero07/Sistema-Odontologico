<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
/* Colores sólidos en bloque, sin degradados. */
:root{
  --tinta:#0f1a1c; --papel:#f4f3ef; --verde:#0d7f76; --menta:#d9efeb; --amarillo:#ffd23f; --coral:#ff5a4e; --gris:#5d6b6d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--papel);color:var(--tinta);font-family:'Inter',sans-serif}
.abs{position:absolute}
.capa{position:absolute;inset:0}
.titulo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.98}
.medio{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.12}
.cuerpo{font-family:'Inter',sans-serif;font-weight:500;line-height:1.38}
.etiqueta{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.palabra{display:inline-block;white-space:pre;position:relative;will-change:transform,opacity}
/* Resaltador: un bloque de color sólido que se dibuja detrás de la palabra. */
.marca{position:relative;display:inline-block;white-space:pre;isolation:isolate}
.marca .fondo-marca{position:absolute;left:-.08em;right:-.08em;top:.12em;bottom:.02em;transform-origin:left center;z-index:-1}
.marca-in{position:relative;z-index:1;display:inline-block}
/* Laptop plana: la pantalla se ve completa. */
.laptop .tapa{background:#16201f;border-radius:22px 22px 6px 6px;padding:16px 16px 18px;box-shadow:0 40px 70px -40px rgba(0,0,0,.55)}
.laptop .tapa .camara{position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#2c3837}
.laptop .pantalla{position:relative;overflow:hidden;border-radius:4px;background:#fff}
.laptop .pantalla img{display:block;width:100%}
.laptop .base{height:18px;margin:0 -3.5%;background:#c9cdc9;border-radius:0 0 16px 16px;position:relative}
.laptop .base::after{content:'';position:absolute;top:0;left:42%;right:42%;height:7px;background:#b3b8b4;border-radius:0 0 8px 8px}
.telefono{border-radius:54px;padding:10px;background:#111617;box-shadow:0 40px 70px -36px rgba(0,0,0,.6),0 0 0 1.5px #2b3335}
.telefono .pantalla{border-radius:45px;overflow:hidden;position:relative;background:#fff;width:100%;height:100%}
.telefono .isla{position:absolute;top:11px;left:50%;width:30%;height:26px;margin-left:-15%;background:#111617;border-radius:16px;z-index:2}
.telefono img{display:block;width:100%;height:100%;object-fit:cover}
/* Lupa: amplía una zona de la pantalla, sin taparla. */
.lupa{border-radius:22px;overflow:hidden;background:#fff;border:5px solid #fff;box-shadow:0 30px 60px -24px rgba(0,0,0,.5)}
.lupa .marco{position:relative;overflow:hidden;width:100%;height:100%;border-radius:16px}
.icono{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tarjeta{border-radius:26px;background:#fff;box-shadow:0 24px 50px -30px rgba(0,0,0,.35)}
.boton{display:inline-flex;align-items:center;gap:18px;border-radius:999px;font-family:'Plus Jakarta Sans';font-weight:800}
.chip{display:inline-flex;align-items:center;gap:10px;border-radius:999px;font-weight:700;white-space:nowrap}
.cortina{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
