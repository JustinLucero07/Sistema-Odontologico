<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{
  --tinta:#04191b; --tinta2:#072628; --verde:#0d7f76; --verde2:#1fb3a4; --menta:#5eead4; --oro:#e2b155; --oro2:#f4d28e;
  --rojo:#ff6b5e; --blanco:#f3fbfa; --gris:#9db7b5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--tinta);color:var(--blanco);font-family:'Inter',sans-serif}
.abs{position:absolute}
.capa{position:absolute;inset:0}
.titulo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.98}
.medio{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.kicker{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--menta)}
.palabra.oro,.palabra.menta{padding-bottom:.14em;margin-bottom:-.14em;padding-right:.04em;margin-right:-.04em}
.palabra{display:inline-block;will-change:transform,opacity,filter;white-space:pre}
.oro{color:var(--oro);background:linear-gradient(180deg,var(--oro2),var(--oro));-webkit-background-clip:text;background-clip:text;color:transparent}
.menta{background:linear-gradient(120deg,#a7f3e4,var(--menta) 40%,var(--verde2));-webkit-background-clip:text;background-clip:text;color:transparent}
.vidrio{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.16);
  box-shadow:0 50px 120px -40px rgba(0,0,0,.75),inset 0 1.5px 0 rgba(255,255,255,.25);backdrop-filter:blur(24px)}
.ventana{border-radius:22px;overflow:hidden}
.ventana .barra{height:40px;display:flex;align-items:center;gap:9px;padding:0 18px;background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.ventana .barra b{width:12px;height:12px;border-radius:50%;display:block}
.ventana .url{margin-left:18px;flex:1;max-width:420px;height:24px;border-radius:12px;background:rgba(0,0,0,.25);font-size:13px;color:#cfe7e4;display:flex;align-items:center;padding:0 12px;gap:8px}
.ventana img{display:block;width:100%}
.telefono{border-radius:64px;padding:13px;background:linear-gradient(145deg,#2c3b3d,#0b1415 60%,#1f2c2d);box-shadow:0 60px 120px -40px rgba(0,0,0,.85),inset 0 0 0 2px rgba(255,255,255,.12)}
.telefono .pantalla{border-radius:52px;overflow:hidden;position:relative;background:#000}
.telefono .isla{position:absolute;top:14px;left:50%;width:30%;height:30px;margin-left:-15%;background:#000;border-radius:20px;z-index:2}
.telefono img{display:block;width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:12px;padding:13px 22px;border-radius:999px;font-weight:600;white-space:nowrap}
.icono{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,#2cc3b1,#0d7f76 60%,#075049);
  box-shadow:0 18px 40px -16px rgba(13,127,118,.9),inset 0 1.5px 0 rgba(255,255,255,.35)}
.icono svg{fill:#fff}
.tarjeta{border-radius:30px;padding:30px}
.grano{position:absolute;inset:-50%;opacity:.06;mix-blend-mode:overlay;pointer-events:none}
.vineta{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.destello{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.boton{display:inline-flex;align-items:center;gap:18px;border-radius:999px;font-family:'Plus Jakarta Sans';font-weight:800;color:#04191b;
  background:linear-gradient(135deg,#f9e2a8,var(--oro) 55%,#c98d2c);box-shadow:0 30px 80px -20px rgba(226,177,85,.7),inset 0 2px 0 rgba(255,255,255,.6)}
.tachon{position:absolute;height:8px;border-radius:6px;background:var(--rojo);transform-origin:left center;box-shadow:0 0 30px rgba(255,107,94,.6)}
.barra-prog{position:absolute;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.barra-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--menta),var(--oro));transform-origin:left}
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
