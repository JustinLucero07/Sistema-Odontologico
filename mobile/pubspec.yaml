name: odonto_movil
description: Sistema Odontológico — aplicación para el equipo de la clínica.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Textos de Material (calendario, horas, botones) en español.
  flutter_localizations:
    sdk: flutter

  # Estado. Riverpod en lugar de un singleton global: cada pantalla declara de
  # qué depende, y eso hace que se pueda probar sin levantar la app entera.
  flutter_riverpod: ^2.6.1

  # Red. Dio por sus interceptores: el refresco del token vive en uno solo, no
  # repartido por cada llamada.
  dio: ^5.7.0

  # El token de refresco va al llavero de Android / Keychain de iOS, nunca a
  # SharedPreferences: un móvil con root leería SharedPreferences en claro.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  go_router: ^14.6.2
  intl: ^0.20.1

  # Cámara para radiografías y fotos intraorales, que es lo que el móvil aporta
  # y el escritorio no puede.
  image_picker: ^1.1.2

  cached_network_image: ^3.4.1
  url_launcher: ^6.3.3

  # Facturación: elegir la firma electrónica (.p12) y abrir el PDF de la
  # factura con el visor del teléfono.
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Icono de la ventana en Linux (el mismo logo de Android y la web).
  assets:
    - assets/icon.png

  # Las mismas familias que la web: Plus Jakarta Sans para títulos e Inter
  # para el texto. Van incluidas (licencia OFL) para no depender de la red, y
  # en pesos fijos porque los ejes variables no los respeta igual cada
  # plataforma.
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/Jakarta-400.ttf
          weight: 400
        - asset: assets/fonts/Jakarta-500.ttf
          weight: 500
        - asset: assets/fonts/Jakarta-600.ttf
          weight: 600
        - asset: assets/fonts/Jakarta-700.ttf
          weight: 700
        - asset: assets/fonts/Jakarta-800.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
