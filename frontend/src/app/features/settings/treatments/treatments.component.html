<div class="page">
  <h1>Catálogo de tratamientos</h1>

  <mat-card class="form-card">
    <h2>Nuevo tratamiento</h2>
    <form [formGroup]="form" (ngSubmit)="submit()" class="treatment-form">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" placeholder="Ej. Endodoncia" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Precio base</mat-label>
        <input matInput type="number" formControlName="default_price" min="0" step="0.01" />
        <span matTextPrefix>$&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
        <mat-icon>add</mat-icon>
        Agregar al catálogo
      </button>
    </form>
  </mat-card>

  <mat-card class="table-card">
    <table mat-table [dataSource]="treatments()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Tratamiento</th>
        <td mat-cell *matCellDef="let t">{{ t.name }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio base</th>
        <td mat-cell *matCellDef="let t">{{ t.default_price | number: '1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let t">{{ t.is_active ? 'Activo' : 'Inactivo' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let t">
          <button mat-button (click)="toggleActive(t)">
            {{ t.is_active ? 'Desactivar' : 'Reactivar' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
</div>
