<div class="page">
  <h1>Odontograma</h1>

  @if (!selectedPatient()) {
    <app-patient-picker
      hint="Busca un paciente para abrir su odontograma directamente."
      (selected)="select($event)"
    ></app-patient-picker>
  } @else {
    <div class="selected-header">
      <button type="button" class="back-button" (click)="clearSelection()">
        <mat-icon>arrow_back</mat-icon>
        Buscar otro paciente
      </button>
      <h2>{{ selectedPatient()!.first_name }} {{ selectedPatient()!.last_name }}</h2>
    </div>

    <app-odontogram [patientId]="selectedPatient()!.id"></app-odontogram>
  }
</div>
