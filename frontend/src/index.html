<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sistema Odontológico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d7f76">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // El tema se aplica antes de pintar nada: sin esto, quien usa el modo
    // oscuro ve un destello blanco mientras arranca la aplicación.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('odonto.theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    /* Pantalla de arranque: vive aquí, en línea, porque tiene que verse antes
       de que cargue Angular. Angular la reemplaza al iniciar. */
    .boot {
      --boot-bg: #eef3f1;
      --boot-ink: #0f2427;
      --boot-soft: rgba(15, 36, 39, 0.5);
      --boot-track: rgba(13, 127, 118, 0.14);
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 22px;
      background:
        radial-gradient(60% 50% at 20% 10%, rgba(47, 191, 174, 0.22), transparent 70%),
        radial-gradient(50% 50% at 90% 90%, rgba(185, 131, 47, 0.14), transparent 70%),
        var(--boot-bg);
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      color: var(--boot-ink);
    }

    [data-theme='dark'] .boot {
      --boot-bg: #0a1618;
      --boot-ink: #e7f1f1;
      --boot-soft: rgba(231, 241, 241, 0.5);
      --boot-track: rgba(52, 211, 192, 0.16);
    }

    .boot-mark {
      position: relative;
      width: 96px;
      height: 96px;
    }

    /* Aro que gira alrededor del logo. */
    .boot-mark::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 34px;
      background: conic-gradient(from 0deg, transparent 0 55%, #2fbfae 80%, #0d7f76 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 3px;
      animation: boot-spin 1.4s linear infinite;
    }

    /* Resplandor que respira. */
    .boot-mark::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 28px;
      background: #1fb3a4;
      filter: blur(26px);
      opacity: 0.45;
      z-index: -1;
      animation: boot-breathe 2.4s ease-in-out infinite;
    }

    .boot-mark svg {
      position: relative;
      display: block;
      width: 96px;
      height: 96px;
      border-radius: 26px;
      box-shadow: 0 18px 40px -16px rgba(7, 74, 69, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      animation: boot-float 2.4s ease-in-out infinite;
    }

    .boot-name {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .boot-sub {
      margin-top: -16px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.8rem;
      color: var(--boot-soft);
    }

    .boot-bar {
      position: relative;
      width: 160px;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--boot-track);
    }

    .boot-bar::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2fbfae, #0d7f76);
      animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @keyframes boot-breathe { 50% { opacity: 0.75; transform: scale(1.08); } }
    @keyframes boot-float { 50% { transform: translateY(-4px); } }
    @keyframes boot-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(260%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark::before,
      .boot-mark::after,
      .boot-mark svg { animation: none; }
      .boot-bar::before { animation-duration: 2.4s; }
    }
  </style>
</head>
<body class="mat-typography">
  <app-root>
    <div class="boot" role="status" aria-label="Cargando el sistema">
      <div class="boot-mark">
        <svg viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
            <linearGradient id="boot-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fb3a4"/><stop offset="0.55" stop-color="#0d7f76"/><stop offset="1" stop-color="#074a45"/></linearGradient>
            <radialGradient id="boot-glow" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="1024" height="1024" fill="url(#boot-bg)"/>
          <rect width="1024" height="1024" fill="url(#boot-glow)"/>
          <g transform="translate(232 212) scale(17.5)">
            <path d="M16 3.4c-6.1 0-10.6 3.3-10.6 8.9 0 3.9 1.1 6.9 1.9 10.9.6 3 1 5.8 3 5.8s2.4-2.7 3.1-5.5c.5-2 1.3-3.1 2.6-3.1s2.1 1.1 2.6 3.1c.7 2.8 1.1 5.5 3.1 5.5s2.4-2.8 3-5.8c.8-4 1.9-7 1.9-10.9 0-5.6-4.5-8.9-10.6-8.9Z" fill="#fff" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M10.4 9.1c1-1.6 2.9-2.6 5-2.6" stroke="#0d7f76" stroke-width="1.6" stroke-linecap="round" opacity="0.5" fill="none"/>
          </g>
        </svg>
      </div>
      <div class="boot-name">Sistema Odontológico</div>
      <div class="boot-sub">Preparando su clínica…</div>
      <div class="boot-bar"></div>
    </div>
  </app-root>
</body>
</html>
